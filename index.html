<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>OBITREND FOOTBALL WORLD 27</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070b;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  color:#fff;
}

/* MAIN SCREEN */
#app{
  width:100%;
  height:100%;
  min-height:100vh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 20%,rgba(255,255,255,.12),transparent 35%),
    linear-gradient(145deg,#111827,#030407 70%);
}

/* STADIUM LIGHT EFFECT */
.light{
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  background:rgba(255,255,255,.16);
  filter:blur(55px);
  pointer-events:none;
}

.light.one{
  top:-60px;
  left:5%;
}

.light.two{
  top:-50px;
  right:5%;
}

/* TOP BRAND */
.brand{
  position:absolute;
  top:22px;
  left:22px;
  z-index:5;
}

.brand-small{
  font-size:10px;
  letter-spacing:4px;
  font-weight:700;
  opacity:.8;
}

.logo{
  margin-top:3px;
  font-size:27px;
  line-height:1;
  font-weight:900;
  letter-spacing:1px;
}

.logo span{
  color:#e3262e;
}

/* CAMERA LABEL */
.camera{
  position:absolute;
  top:24px;
  right:22px;
  text-align:right;
  z-index:5;
}

.camera-title{
  font-size:10px;
  letter-spacing:2px;
  opacity:.8;
}

.camera-name{
  font-size:18px;
  font-weight:900;
  margin-top:3px;
}

.camera-sub{
  font-size:8px;
  letter-spacing:1.5px;
  opacity:.7;
  margin-top:3px;
}

/* HERO */
.hero{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

.eyebrow{
  font-size:11px;
  letter-spacing:6px;
  font-weight:700;
  opacity:.75;
  margin-bottom:12px;
}

h1{
  font-size:clamp(42px,10vw,86px);
  line-height:.9;
  font-weight:1000;
  letter-spacing:-3px;
  text-shadow:0 8px 30px rgba(0,0,0,.7);
}

h1 span{
  color:#e3262e;
}

.tagline{
  margin-top:15px;
  font-size:12px;
  letter-spacing:5px;
  opacity:.8;
}

/* BUTTONS */
.actions{
  display:flex;
  gap:12px;
  margin-top:30px;
  flex-wrap:wrap;
  justify-content:center;
}

button{
  border:0;
  cursor:pointer;
  color:white;
  font-weight:800;
  letter-spacing:1px;
  border-radius:10px;
  padding:15px 25px;
  min-width:145px;
  font-size:13px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(12px);
  -webkit-tap-highlight-color:transparent;
}

button:active{
  transform:scale(.96);
}

.play{
  background:#e3262e;
  border-color:#ff555c;
  box-shadow:0 8px 35px rgba(227,38,46,.35);
}

/* FEATURES */
.features{
  position:absolute;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  width:min(900px,92%);
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.feature{
  padding:9px 14px;
  border-radius:30px;
  background:rgba(0,0,0,.3);
  border:1px solid rgba(255,255,255,.12);
  font-size:9px;
  letter-spacing:1.5px;
  opacity:.85;
}

/* GAME SCREEN */
#game{
  position:absolute;
  inset:0;
  display:none;
  background:
    linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.4)),
    repeating-linear-gradient(
      90deg,
      #247a3c 0px,
      #247a3c 45px,
      #2b8544 45px,
      #2b8544 90px
    );
}

.pitch-line{
  position:absolute;
  inset:8%;
  border:3px solid rgba(255,255,255,.85);
  border-radius:2px;
}

.center-line{
  position:absolute;
  left:50%;
  top:8%;
  bottom:8%;
  width:3px;
  background:rgba(255,255,255,.85);
}

.center-circle{
  position:absolute;
  left:50%;
  top:50%;
  width:150px;
  height:150px;
  transform:translate(-50%,-50%);
  border:3px solid rgba(255,255,255,.85);
  border-radius:50%;
}

/* PLAYER */
.player{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:28px;
  height:42px;
}

.player .head{
  width:14px;
  height:14px;
  margin:auto;
  border-radius:50%;
  background:#9b633f;
}

.player .body{
  width:20px;
  height:24px;
  margin:auto;
  background:#fff;
  border-radius:5px;
}

/* BALL */
.ball{
  position:absolute;
  left:calc(50% + 28px);
  top:50%;
  width:16px;
  height:16px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.5);
}

/* CONTROLS */
.controls{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.joystick{
  position:absolute;
  bottom:30px;
  left:25px;
  width:105px;
  height:105px;
  border-radius:50%;
  background:rgba(255,255,255,.1);
  border:2px solid rgba(255,255,255,.3);
  pointer-events:auto;
}

.stick{
  position:absolute;
  left:50%;
  top:50%;
  width:45px;
  height:45px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:rgba(255,255,255,.45);
}

.game-buttons{
  position:absolute;
  right:25px;
  bottom:25px;
  display:flex;
  gap:10px;
  pointer-events:auto;
}

.game-buttons button{
  min-width:72px;
  min-height:52px;
  padding:10px;
  font-size:10px;
}

#back{
  position:absolute;
  top:20px;
  left:20px;
  min-width:auto;
  padding:10px 15px;
  pointer-events:auto;
}

/* PHONE */
@media(max-width:600px){
  .brand{
    top:14px;
    left:14px;
  }

  .camera{
    top:15px;
    right:14px;
  }

  .logo{
    font-size:21px;
  }

  .camera-name{
    font-size:14px;
  }

  .eyebrow{
    font-size:8px;
    letter-spacing:4px;
  }

  h1{
    font-size:44px;
  }

  .tagline{
    font-size:9px;
    letter-spacing:3px;
  }

  .actions{
    margin-top:24px;
  }

  button{
    min-width:130px;
    padding:13px 18px;
  }

  .features{
    bottom:12px;
  }

  .feature{
    font-size:7px;
    padding:7px 9px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div class="light one"></div>
  <div class="light two"></div>

  <div class="brand">
    <div class="brand-small">OBITREND</div>
    <div class="logo">FOOTBALL WORLD <span>27</span></div>
  </div>

  <div class="camera">
    <div class="camera-title">VISUAL ENGINE</div>
    <div class="camera-name">X-T5 INSPIRED</div>
    <div class="camera-sub">REALISTIC PHOTOGRAPHIC LOOK</div>
  </div>

  <section class="hero">

    <div class="eyebrow">A NEW FOOTBALL REALITY</div>

    <h1>
      PLAY<br>
      <span>BEYOND</span><br>
      THE PITCH
    </h1>

    <div class="tagline">
      FOOTBALL • OPEN WORLD • NEXT GENERATION
    </div>

    <div class="actions">
      <button class="play" onclick="startGame()">
        PLAY NOW
      </button>

      <button onclick="showComingSoon()">
        EXPLORE WORLD
      </button>
    </div>

  </section>

  <div class="features">
    <div class="feature">REALISTIC GRAPHICS</div>
    <div class="feature">OPEN WORLD</div>
    <div class="feature">CAREER MODE</div>
    <div class="feature">LEAGUES & CUPS</div>
    <div class="feature">WORLD TOURNAMENTS</div>
  </div>

  <!-- FIRST PLAYABLE SCREEN -->
  <div id="game">

    <button id="back" onclick="backToMenu()">← MENU</button>

    <div class="pitch-line"></div>
    <div class="center-line"></div>
    <div class="center-circle"></div>

    <div class="player">
      <div class="head"></div>
      <div class="body"></div>
    </div>

    <div class="ball"></div>

    <div class="controls">

      <div class="joystick">
        <div class="stick"></div>
      </div>

      <div class="game-buttons">
        <button onclick="passBall()">PASS</button>
        <button onclick="shootBall()">SHOOT</button>
        <button onclick="sprint()">SPRINT</button>
      </div>

    </div>

  </div>

</div>

<script>
function startGame(){
  document.querySelector('.hero').style.display='none';
  document.querySelector('.features').style.display='none';
  document.getElementById('game').style.display='block';
}

function backToMenu(){
  document.getElementById('game').style.display='none';
  document.querySelector('.hero').style.display='flex';
  document.querySelector('.features').style.display='flex';
}

function showComingSoon(){
  alert('Open World Football City — coming in the next development phase.');
}

function passBall(){
  const ball=document.querySelector('.ball');
  ball.style.transition='transform .4s ease';
  ball.style.transform='translateX(80px)';
  setTimeout(()=>{
    ball.style.transform='translateX(0)';
  },450);
}

function shootBall(){
  const ball=document.querySelector('.ball');
  ball.style.transition='transform .7s ease';
  ball.style.transform='translate(260px,-80px)';
  setTimeout(()=>{
    ball.style.transform='translate(0,0)';
  },750);
}

function sprint(){
  const player=document.querySelector('.player');
  player.style.transition='transform .25s ease';
  player.style.transform='translate(-50%,-50%) scale(1.15)';
  setTimeout(()=>{
    player.style.transform='translate(-50%,-50%)';
  },300);
}
</script>

</body>
</html>
