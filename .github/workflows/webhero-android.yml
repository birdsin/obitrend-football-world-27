name: Build WEB HERO 27 Android

on:
  workflow_dispatch:
  push:
    paths:
      - "webhero/**"
      - ".github/workflows/webhero-android.yml"
      - "capacitor.config.json"

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare WEB HERO web bundle
        run: |
          rm -rf www
          mkdir -p www
          cp -R webhero/. www/
          test -f www/index.html

      - name: Install Capacitor
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WEB-HERO-27-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: WEB-HERO-27-Android-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
