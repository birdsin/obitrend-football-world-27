name: Install Virtual PS5 Controls

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject virtual PS5 controller
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          text = p.read_text(encoding="utf-8")
          marker = '<script src="virtual-ps5.js"></script>'
          if marker not in text:
              needle = "</body>"
              if needle not in text:
                  raise SystemExit("Could not find </body> in index.html")
              text = text.replace(needle, marker + "\n" + needle, 1)
              p.write_text(text, encoding="utf-8")
              print("Virtual PS5 controller installed.")
          else:
              print("Virtual PS5 controller already installed.")

      - name: Commit installation
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable virtual PS5 controls"
          git push
