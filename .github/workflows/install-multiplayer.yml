name: install multiplayer loader
on:
  push:
    branches: [multiplayer-live]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install multiplayer loader
        shell: python
        run: |
          from pathlib import Path
          p=Path('virtual-ps5.js')
          s=p.read_text(encoding='utf-8')
          marker='multiplayer.js'
          if marker not in s:
              needle='})();'
              loader="\n// Load online multiplayer without changing the existing match workflow.\n(function(){if(window.__obiMPBoot)return;window.__obiMPBoot=true;var x=document.createElement('script');x.src='multiplayer.js';x.async=true;document.head.appendChild(x);})();\n"
              i=s.rfind(needle)
              if i<0: raise SystemExit('virtual-ps5.js footer not found')
              s=s[:i]+loader+s[i:]
              p.write_text(s,encoding='utf-8')
      - name: Commit loader
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add virtual-ps5.js
          if git diff --cached --quiet; then echo 'No patch needed'; exit 0; fi
          git commit -m 'Connect online multiplayer to existing game workflow'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/install-multiplayer.yml
          git add -A
          git commit -m 'Remove temporary multiplayer installer'
          git push
